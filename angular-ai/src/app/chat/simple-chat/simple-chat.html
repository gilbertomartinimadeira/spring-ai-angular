<mat-card class="chat-container">
  <div>
    <mat-toolbar>
      <span>Simple Chat</span>
    </mat-toolbar>
  </div>
  <div class="chat-history" #chatHistory>
    <div class="messages">
      @for (message of messages(); track $index) {
        <div class="message" >
          <div class="message-bubble" [class.user-message]="!message.isBot">
            {{ message.text }}
          </div>
        </div>
      }
    </div>
  </div>

  <div class="chat-input">
    <mat-form-field class="full-width">
      <!-- <mat-label>Ask anything</mat-label> -->
      <input matInput
             [(ngModel)]="userInput"
             (keyup.enter)="onSendClick()"
             [disabled]="isLoading"
             placeholder="{{ isLoading ? 'Wait...':''}}">
      <button matIconButton
              aria-label="Send"
              matSuffix
              (click)="onSendClick()"
              ><mat-icon>send</mat-icon></button>
    </mat-form-field>
  </div>
</mat-card>
